<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="'JetBrains Mono', monospace">
  <title>ADDIPLAY — Help overlay</title>
  <desc>Wireframe: opened with `?`. Centered popover showing all keybindings organized by section. Esc or ? to close.</desc>

  <rect width="1100" height="720" fill="#f7f8fa"/>

  <text x="28" y="38" font-size="14" fill="#6b7280" font-weight="500" letter-spacing="0.08em">HELP · KEYBINDINGS OVERLAY</text>
  <text x="28" y="58" font-size="11" fill="#9aa3b2">Triggered by `?`. The background view (channel list) is dimmed; the popover centers over it. Esc or `?` again to close.</text>

  <g transform="translate(28,80)">
    <rect x="2" y="3" width="1044" height="592" rx="10" fill="#000" opacity="0.07"/>
    <rect x="0" y="0" width="1044" height="28" rx="10" fill="#1f2632"/>
    <rect x="0" y="14" width="1044" height="14" fill="#1f2632"/>
    <circle cx="16" cy="14" r="6" fill="#ff5f57"/>
    <circle cx="36" cy="14" r="6" fill="#febc2e"/>
    <circle cx="56" cy="14" r="6" fill="#28c840"/>
    <text x="522" y="18" text-anchor="middle" font-size="10" fill="#6b7280">addiplay · keybindings</text>

    <!-- terminal body: dimmed background + modal -->
    <rect x="0" y="28" width="1044" height="564" fill="#151b25"/>

    <!-- DIMMED BACKGROUND (ghost of channel list, low opacity) -->
    <g transform="translate(12,40)" font-size="14" fill="#e6e6e6" xml:space="preserve" opacity="0.18">
      <!-- header -->
      <text x="4" y="0" font-weight="700">addiplay</text>
      <rect x="72" y="-12" width="42" height="16" rx="2" fill="#288cfb"/>
      <text x="78" y="0" fill="#151b25" font-size="11" font-weight="700">DI.fm</text>
      <text x="130" y="0">◆ ALL ◆  FAVORITES</text>

      <!-- channel cards ghost -->
      <g transform="translate(0,18)">
        <rect x="2" y="6" width="640" height="80" rx="4" fill="#212737" stroke="#288cfb" stroke-width="1"/>
        <text x="14" y="26">▸ Classic Trance</text>
        <rect x="2" y="94" width="640" height="80" rx="4" fill="#1a212e" stroke="#2a3344" stroke-width="1"/>
        <text x="14" y="114">  Vocal Trance</text>
        <rect x="2" y="182" width="640" height="80" rx="4" fill="#1a212e" stroke="#2a3344" stroke-width="1"/>
        <text x="14" y="202">  Progressive</text>
      </g>

      <!-- status bar ghost -->
      <rect x="0" y="432" width="1020" height="20" fill="#212737"/>
    </g>

    <!-- MODAL OVERLAY (centered) -->
    <g transform="translate(282,56)" font-size="14" xml:space="preserve">

      <!-- drop shadow -->
      <rect x="3" y="4" width="480" height="490" rx="6" fill="#000" opacity="0.35"/>

      <!-- modal panel -->
      <rect x="0" y="0" width="480" height="490" rx="6" fill="#151b25" stroke="#288cfb" stroke-width="1.5"/>

      <!-- title -->
      <text x="24" y="34" fill="#e6e6e6" font-weight="700" font-size="16">Keybindings</text>
      <text x="24" y="52" fill="#888">────────────────────────────────────────────────</text>

      <!-- ═══════════════════════════════════════════ -->
      <!-- NAVIGATION section                         -->
      <!-- ═══════════════════════════════════════════ -->
      <text x="24" y="76" fill="#888" font-size="12" letter-spacing="0.06em">NAVIGATION</text>

      <!-- ↑/k — up -->
      <rect x="24" y="84" width="40" height="18" rx="3" fill="#288cfb"/>
      <text x="44" y="97" text-anchor="middle" fill="#151b25" font-size="12" font-weight="700">↑/k</text>
      <text x="74" y="97" fill="#e6e6e6">up</text>

      <!-- ↓/j — down -->
      <rect x="24" y="106" width="40" height="18" rx="3" fill="#288cfb"/>
      <text x="44" y="119" text-anchor="middle" fill="#151b25" font-size="12" font-weight="700">↓/j</text>
      <text x="74" y="119" fill="#e6e6e6">down</text>

      <!-- tab — favs/all -->
      <rect x="24" y="128" width="40" height="18" rx="3" fill="#288cfb"/>
      <text x="44" y="141" text-anchor="middle" fill="#151b25" font-size="12" font-weight="700">tab</text>
      <text x="74" y="141" fill="#e6e6e6">favs/all</text>

      <!-- n — network -->
      <rect x="24" y="150" width="40" height="18" rx="3" fill="#288cfb"/>
      <text x="44" y="163" text-anchor="middle" fill="#151b25" font-size="12" font-weight="700">n</text>
      <text x="74" y="163" fill="#e6e6e6">network</text>

      <!-- / — search -->
      <rect x="24" y="172" width="40" height="18" rx="3" fill="#288cfb"/>
      <text x="44" y="185" text-anchor="middle" fill="#151b25" font-size="12" font-weight="700">/</text>
      <text x="74" y="185" fill="#e6e6e6">search</text>

      <!-- ═══════════════════════════════════════════ -->
      <!-- PLAYBACK section                           -->
      <!-- ═══════════════════════════════════════════ -->
      <text x="24" y="212" fill="#888" font-size="12" letter-spacing="0.06em">PLAYBACK</text>

      <!-- enter — play -->
      <rect x="24" y="220" width="52" height="18" rx="3" fill="#288cfb"/>
      <text x="50" y="233" text-anchor="middle" fill="#151b25" font-size="12" font-weight="700">enter</text>
      <text x="86" y="233" fill="#e6e6e6">play</text>

      <!-- space — pause/resume -->
      <rect x="24" y="242" width="52" height="18" rx="3" fill="#288cfb"/>
      <text x="50" y="255" text-anchor="middle" fill="#151b25" font-size="12" font-weight="700">space</text>
      <text x="86" y="255" fill="#e6e6e6">pause/resume</text>

      <!-- s — skip track -->
      <rect x="24" y="264" width="52" height="18" rx="3" fill="#288cfb"/>
      <text x="50" y="277" text-anchor="middle" fill="#151b25" font-size="12" font-weight="700">s</text>
      <text x="86" y="277" fill="#e6e6e6">skip track</text>

      <!-- S — next fav -->
      <rect x="24" y="286" width="52" height="18" rx="3" fill="#288cfb"/>
      <text x="50" y="299" text-anchor="middle" fill="#151b25" font-size="12" font-weight="700">S</text>
      <text x="86" y="299" fill="#e6e6e6">next fav</text>

      <!-- + — vol up -->
      <rect x="24" y="308" width="52" height="18" rx="3" fill="#288cfb"/>
      <text x="50" y="321" text-anchor="middle" fill="#151b25" font-size="12" font-weight="700">+</text>
      <text x="86" y="321" fill="#e6e6e6">vol up</text>

      <!-- - — vol down -->
      <rect x="24" y="330" width="52" height="18" rx="3" fill="#288cfb"/>
      <text x="50" y="343" text-anchor="middle" fill="#151b25" font-size="12" font-weight="700">-</text>
      <text x="86" y="343" fill="#e6e6e6">vol down</text>

      <!-- ═══════════════════════════════════════════ -->
      <!-- VOTING section                             -->
      <!-- ═══════════════════════════════════════════ -->
      <text x="24" y="370" fill="#888" font-size="12" letter-spacing="0.06em">VOTING</text>

      <!-- l — like -->
      <rect x="24" y="378" width="40" height="18" rx="3" fill="#288cfb"/>
      <text x="44" y="391" text-anchor="middle" fill="#151b25" font-size="12" font-weight="700">l</text>
      <text x="74" y="391" fill="#e6e6e6">like</text>

      <!-- d — dislike -->
      <rect x="24" y="400" width="40" height="18" rx="3" fill="#288cfb"/>
      <text x="44" y="413" text-anchor="middle" fill="#151b25" font-size="12" font-weight="700">d</text>
      <text x="74" y="413" fill="#e6e6e6">dislike</text>

      <!-- f — favorite -->
      <rect x="24" y="422" width="40" height="18" rx="3" fill="#288cfb"/>
      <text x="44" y="435" text-anchor="middle" fill="#151b25" font-size="12" font-weight="700">f</text>
      <text x="74" y="435" fill="#e6e6e6">favorite</text>

      <!-- ═══════════════════════════════════════════ -->
      <!-- APP section (right column)                 -->
      <!-- ═══════════════════════════════════════════ -->
      <text x="260" y="76" fill="#888" font-size="12" letter-spacing="0.06em">APP</text>

      <!-- ? — show keys -->
      <rect x="260" y="84" width="40" height="18" rx="3" fill="#288cfb"/>
      <text x="280" y="97" text-anchor="middle" fill="#151b25" font-size="12" font-weight="700">?</text>
      <text x="310" y="97" fill="#e6e6e6">show keys</text>

      <!-- L — logout -->
      <rect x="260" y="106" width="40" height="18" rx="3" fill="#288cfb"/>
      <text x="280" y="119" text-anchor="middle" fill="#151b25" font-size="12" font-weight="700">L</text>
      <text x="310" y="119" fill="#e6e6e6">logout</text>

      <!-- q — quit -->
      <rect x="260" y="128" width="40" height="18" rx="3" fill="#288cfb"/>
      <text x="280" y="141" text-anchor="middle" fill="#151b25" font-size="12" font-weight="700">q</text>
      <text x="310" y="141" fill="#e6e6e6">quit</text>

      <!-- close hint -->
      <text x="24" y="472" fill="#888" font-size="12">[esc] close   [?] toggle</text>

    </g>
  </g>

  <text x="28" y="700" font-size="10" fill="#9aa3b2">The help overlay renders all entries from keymap.go's helpEntries — one source of truth for bindings.</text>
</svg>
