<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720"
     font-family="'JetBrains Mono', monospace">
  <title>ADDIPLAY — Home screen (browsing)</title>
  <desc>Wireframe: card-based channel list, idle state (no playback).
  Grid: CW=8.5 CH=18. 120 cols × 27 rows. Full-width channel list.
  col(c)=c*8.5  row(r)=r*18  baseline(r)=r*18+14</desc>

  <defs>
    <!-- GRID PATTERNS — CW=8.5, CH=18 -->
    <pattern id="grid-cell" width="8.5" height="18" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#ff4444" stroke-width="0.3" opacity="0.15"/>
      <line x1="0" y1="0" x2="8.5" y2="0" stroke="#ff4444" stroke-width="0.3" opacity="0.15"/>
    </pattern>
    <pattern id="grid-major" width="85" height="90" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="90" stroke="#ff4444" stroke-width="0.8" opacity="0.3"/>
      <line x1="0" y1="0" x2="85" y2="0" stroke="#ff4444" stroke-width="0.8" opacity="0.3"/>
    </pattern>

    <!-- ART GRADIENTS -->
    <linearGradient id="thumbBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a7a"/>
      <stop offset="100%" stop-color="#288cfb"/>
    </linearGradient>
    <linearGradient id="thumbPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a2a7a"/>
      <stop offset="100%" stop-color="#a050d0"/>
    </linearGradient>
    <linearGradient id="thumbGrain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.20"/>
    </linearGradient>
  </defs>

  <!-- PAGE BG -->
  <rect width="1100" height="720" fill="#f7f8fa"/>

  <!-- LABEL -->
  <text x="28" y="38" font-size="14" fill="#6b7280" font-weight="500" letter-spacing="0.08em">HOME · CHANNEL BROWSING (IDLE)</text>
  <text x="28" y="58" font-size="11" fill="#9aa3b2">Full-width card list, no playback. Grid: CW=8.5 CH=18. Toggle #grid-overlay to check alignment.</text>

  <g transform="translate(28,80)">
    <!-- macOS CHROME -->
    <rect x="2" y="3" width="1044" height="592" rx="10" fill="#000" opacity="0.07"/>
    <rect x="0" y="0" width="1044" height="28" rx="10" fill="#1f2632"/>
    <rect x="0" y="14" width="1044" height="14" fill="#1f2632"/>
    <circle cx="16" cy="14" r="6" fill="#ff5f57"/>
    <circle cx="36" cy="14" r="6" fill="#febc2e"/>
    <circle cx="56" cy="14" r="6" fill="#28c840"/>
    <text x="522" y="18" text-anchor="middle" font-size="10" fill="#6b7280">addiplay</text>

    <!-- TERMINAL BODY -->
    <rect x="0" y="28" width="1044" height="564" fill="#151b25"/>

    <!-- ================================================================ -->
    <!-- CONTENT — origin (12,30). CW=8.5 CH=18.                        -->
    <!--   col(c) = c*8.5    row(r) = r*18    baseline(r) = r*18+14     -->
    <!--   Content: 1020×486 (120 cols × 27 rows)                        -->
    <!-- ================================================================ -->
    <g transform="translate(12,30)" font-size="14" fill="#e6e6e6" xml:space="preserve">

      <!-- ============================================================ -->
      <!-- ROW 0: HEADER — row(0)=0, h=18                               -->
      <!-- ============================================================ -->
      <rect x="0" y="0" width="1020" height="18" fill="#1a212e"/>
      <text x="0" y="14" fill="#e6e6e6" font-weight="700">addiplay</text>
      <rect x="76.5" y="3" width="42.5" height="14" rx="2" fill="#288cfb"/>
      <text x="80.75" y="14" fill="#ffffff" font-weight="700" font-size="11">DI.fm</text>
      <text x="136" y="14" fill="#288cfb" font-weight="700">◆ ALL ◆</text>
      <text x="221" y="14" fill="#555">FAVORITES</text>
      <text x="909.5" y="14" fill="#555">[?] keys  [q] quit</text>

      <!-- ============================================================ -->
      <!-- FULL-WIDTH CHANNEL LIST — cols 0–119 (1020px), rows 1–24     -->
      <!-- ============================================================ -->
      <rect x="0" y="18" width="1020" height="432" rx="3" fill="none" stroke="#288cfb" stroke-width="1"/>

      <!-- ROW 1: pane header — baseline(1)=32 -->
      <text x="8.5" y="32" fill="#555" font-size="13">119 channels</text>

      <!-- ROW 2: separator — baseline(2)=50 -->
      <text x="8.5" y="50" fill="#2a3344">──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text>

      <!-- ======================================== -->
      <!-- CARD 1 — rows 3–12, SELECTED (no play)   -->
      <!-- Full width: col 1–119 → 1003px            -->
      <!-- ======================================== -->
      <rect x="8.5" y="54" width="1003" height="180" rx="6" fill="#212737" stroke="#288cfb" stroke-width="1.5"/>

      <!-- Thumbnail: cols 2–17, rows 4–11 → 136×144 -->
      <rect x="17" y="72" width="136" height="144" rx="3" fill="url(#thumbBlue)"/>
      <rect x="17" y="72" width="136" height="144" rx="3" fill="url(#thumbGrain)"/>

      <!-- Row 4: title — baseline(4)=86 -->
      <text x="161.5" y="86" fill="#288cfb" font-weight="700">▸ Classic Trance</text>
      <text x="297.5" y="86" fill="#f9dc00">★</text>

      <!-- Row 5: tagline — baseline(5)=104 -->
      <text x="161.5" y="104" fill="#555">the classics that built the genre</text>

      <!-- Row 6: separator — baseline(6)=122 -->
      <text x="161.5" y="122" fill="#2a3344">──────────────────────────────────────────────────────────────────────────────────────────</text>

      <!-- ======================================== -->
      <!-- CARD 2 — rows 13–22, NOT SELECTED         -->
      <!-- ======================================== -->
      <rect x="8.5" y="234" width="1003" height="180" rx="3" fill="#1a212e" stroke="#2a3344" stroke-width="1"/>

      <!-- Thumbnail: cols 2–17, rows 14–21 → 136×144 -->
      <rect x="17" y="252" width="136" height="144" rx="3" fill="url(#thumbPurple)"/>
      <rect x="17" y="252" width="136" height="144" rx="3" fill="url(#thumbGrain)"/>

      <!-- Row 14: title — baseline(14)=266 -->
      <text x="161.5" y="266" fill="#e6e6e6" font-weight="700">  Vocal Trance</text>

      <!-- Row 15: tagline — baseline(15)=284 -->
      <text x="161.5" y="284" fill="#555">female vocals, soaring melodies</text>

      <!-- Row 16: separator — baseline(16)=302 -->
      <text x="161.5" y="302" fill="#2a3344">──────────────────────────────────────────────────────────────────────────────────────────</text>

      <!-- ROW 23: scroll hint — baseline(23)=428 -->
      <text x="8.5" y="428" fill="#555" font-size="12">⋮ 1–2 of 119</text>

      <!-- ============================================================ -->
      <!-- STATUS BAR — rows 25–26                                      -->
      <!-- ============================================================ -->
      <rect x="0" y="450" width="1020" height="18" fill="#212737"/>
      <text x="8.5" y="464" fill="#e6e6e6">·  select a channel · [enter] to play</text>
      <text x="1011.5" y="464" text-anchor="end" fill="#e6e6e6">vol 65%</text>

      <rect x="0" y="468" width="1020" height="18" fill="#212737"/>
      <text x="8.5" y="482" fill="#555">[enter] play   [space] pause   [l] like   [/] search   [?] more</text>

      <!-- ============================================================ -->
      <!-- GRID OVERLAY — toggle display="none" to hide                 -->
      <!-- ============================================================ -->
      <g id="grid-overlay" display="none">
        <rect x="0" y="0" width="1020" height="486" fill="url(#grid-cell)"/>
        <rect x="0" y="0" width="1020" height="486" fill="url(#grid-major)"/>

        <g font-size="7" fill="#ff4444" opacity="0.7">
          <text x="0" y="-2">c0</text>
          <text x="85" y="-2">c10</text>
          <text x="170" y="-2">c20</text>
          <text x="255" y="-2">c30</text>
          <text x="340" y="-2">c40</text>
          <text x="425" y="-2">c50</text>
          <text x="510" y="-2">c60</text>
          <text x="595" y="-2">c70</text>
          <text x="680" y="-2">c80</text>
          <text x="765" y="-2">c90</text>
          <text x="850" y="-2">c100</text>
          <text x="935" y="-2">c110</text>
          <text x="1012" y="-2">c120</text>
        </g>
        <g font-size="7" fill="#ff4444" opacity="0.7" text-anchor="end">
          <text x="-2" y="14">r0</text>
          <text x="-2" y="32">r1</text>
          <text x="-2" y="50">r2</text>
          <text x="-2" y="68">r3</text>
          <text x="-2" y="104">r5</text>
          <text x="-2" y="194">r10</text>
          <text x="-2" y="284">r15</text>
          <text x="-2" y="374">r20</text>
          <text x="-2" y="464">r25</text>
        </g>
      </g>

    </g>
  </g>

  <text x="28" y="700" font-size="10" fill="#9aa3b2">Card thumbs: 16×8 cells (136×144px, visually square). Track info only on playing card (see play.svg).</text>
</svg>
