<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="'JetBrains Mono', monospace">
  <title>ADDIPLAY — Network picker</title>
  <desc>Wireframe: opened with `n`. Centered popover listing every AudioAddict network with its theme accent swatch. Esc to cancel.</desc>

  <rect width="1100" height="720" fill="#f7f8fa"/>

  <text x="28" y="38" font-size="14" fill="#6b7280" font-weight="500" letter-spacing="0.08em">NETWORK · PICKER OVERLAY</text>
  <text x="28" y="58" font-size="11" fill="#9aa3b2">Triggered by `n`. The background view (channel list) is dimmed; the picker centers over it. Each row shows the network's accent color as a swatch.</text>

  <g transform="translate(28,80)">
    <!-- macOS window chrome -->
    <rect x="2" y="3" width="1044" height="592" rx="10" fill="#000" opacity="0.07"/>
    <rect x="0" y="0" width="1044" height="28" rx="10" fill="#1f2632"/>
    <rect x="0" y="14" width="1044" height="14" fill="#1f2632"/>
    <circle cx="16" cy="14" r="6" fill="#ff5f57"/>
    <circle cx="36" cy="14" r="6" fill="#febc2e"/>
    <circle cx="56" cy="14" r="6" fill="#28c840"/>
    <text x="522" y="18" text-anchor="middle" font-size="10" fill="#6b7280">addiplay · switch network</text>

    <!-- terminal body -->
    <rect x="0" y="28" width="1044" height="564" fill="#151b25"/>

    <!-- DIMMED BACKGROUND (ghost of home screen, low opacity) -->
    <g transform="translate(12,40)" font-size="14" fill="#e6e6e6" xml:space="preserve" opacity="0.18">
      <!-- header bar -->
      <text x="4" y="0" fill="#e6e6e6" font-weight="700">addiplay</text>
      <rect x="80" y="-13" width="42" height="18" fill="#288cfb"/>
      <text x="84" y="0" fill="#151b25" font-weight="700">DI.fm</text>
      <text x="140" y="0" fill="#288cfb">◆ ALL ◆</text>
      <text x="230" y="0" fill="#888">FAVORITES</text>

      <!-- ghost channel cards -->
      <g transform="translate(0,18)">
        <rect x="10" y="8" width="1008" height="80" fill="#212737" stroke="#288cfb" stroke-width="1.5" rx="6"/>
        <text x="30" y="36" fill="#e6e6e6" font-weight="700">▸ Classic Trance</text>
        <text x="30" y="56" fill="#888">the classics that built the genre</text>

        <rect x="10" y="96" width="1008" height="80" fill="#1a212e" stroke="#2a3344" stroke-width="1" rx="3"/>
        <text x="30" y="124" fill="#e6e6e6">  Vocal Trance</text>
        <text x="30" y="144" fill="#888">female vocals, soaring melodies</text>

        <rect x="10" y="184" width="1008" height="80" fill="#1a212e" stroke="#2a3344" stroke-width="1" rx="3"/>
        <text x="30" y="212" fill="#e6e6e6">  Progressive</text>
        <text x="30" y="232" fill="#888">deep, hypnotic, sun-drenched grooves</text>

        <rect x="10" y="272" width="1008" height="80" fill="#1a212e" stroke="#2a3344" stroke-width="1" rx="3"/>
        <text x="30" y="300" fill="#e6e6e6">  Trance</text>
        <text x="30" y="320" fill="#888">melodic, euphoric, driving beats</text>
      </g>

      <!-- ghost status bar -->
      <rect x="0" y="410" width="1020" height="20" fill="#212737"/>
      <text x="8" y="424" fill="#e6e6e6">·  select a channel</text>
    </g>

    <!-- MODAL OVERLAY (centered) -->
    <g transform="translate(342,100)" font-size="14" xml:space="preserve">

      <!-- subtle drop-shadow under the modal -->
      <rect x="3" y="4" width="360" height="360" rx="6" fill="#000" opacity="0.35"/>

      <!-- modal panel -->
      <rect x="0" y="0" width="360" height="360" rx="6" fill="#151b25" stroke="#288cfb" stroke-width="1.5"/>

      <!-- title -->
      <text x="20" y="32" fill="#e6e6e6" font-weight="700">Switch network</text>
      <text x="20" y="50" fill="#888">──────────────────────────────</text>

      <!-- DI.fm (selected — cursor + bold + accent) -->
      <text x="20" y="86" fill="#288cfb" font-weight="700">▸</text>
      <rect x="38" y="74" width="18" height="14" fill="#288cfb"/>
      <text x="64" y="86" fill="#288cfb" font-weight="700">DI.fm</text>

      <!-- RadioTunes -->
      <text x="38" y="112" fill="#e6e6e6"> </text>
      <rect x="38" y="100" width="18" height="14" fill="#eb8700"/>
      <text x="64" y="112" fill="#e6e6e6">RadioTunes</text>

      <!-- RockRadio -->
      <rect x="38" y="126" width="18" height="14" fill="#f9dc00"/>
      <text x="64" y="138" fill="#e6e6e6">RockRadio</text>

      <!-- JazzRadio -->
      <rect x="38" y="152" width="18" height="14" fill="#e8a548"/>
      <text x="64" y="164" fill="#e6e6e6">JazzRadio</text>

      <!-- ClassicalRadio -->
      <rect x="38" y="178" width="18" height="14" fill="#3ac6a1"/>
      <text x="64" y="190" fill="#e6e6e6">ClassicalRadio</text>

      <!-- ZenRadio -->
      <rect x="38" y="204" width="18" height="14" fill="#15afa7"/>
      <text x="64" y="216" fill="#e6e6e6">ZenRadio</text>

      <!-- FrescaTune -->
      <rect x="38" y="230" width="18" height="14" fill="#ec8f3c"/>
      <text x="64" y="242" fill="#e6e6e6">FrescaTune</text>

      <!-- separator -->
      <text x="20" y="278" fill="#888">──────────────────────────────</text>

      <!-- key hints inside modal -->
      <text x="20" y="310" fill="#888">↑↓ select   enter switch   esc cancel</text>
    </g>
  </g>

  <text x="28" y="700" font-size="10" fill="#9aa3b2">Each network's theme lives in internal/ui/theme.go — accents are pulled from the AudioAddict brand palette.</text>
</svg>
