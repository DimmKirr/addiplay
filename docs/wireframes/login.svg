<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="'JetBrains Mono', monospace">
  <title>ADDIPLAY — Login</title>
  <desc>Wireframe: credential entry overlay. Centered popover over the dimmed channel list. Shown on first run or when session_key is rejected.</desc>

  <rect width="1100" height="720" fill="#f7f8fa"/>

  <text x="28" y="38" font-size="14" fill="#6b7280" font-weight="500" letter-spacing="0.08em">LOGIN · CREDENTIAL OVERLAY</text>
  <text x="28" y="58" font-size="11" fill="#9aa3b2">Centered popover via renderCenteredPopover. Auto-prompted on first run, session expiry (401), or `L` logout. Esc returns to channel list when a session already exists.</text>

  <g transform="translate(28,80)">
    <!-- window shadow -->
    <rect x="2" y="3" width="1044" height="592" rx="10" fill="#000" opacity="0.07"/>
    <!-- title bar -->
    <rect x="0" y="0" width="1044" height="28" rx="10" fill="#1f2632"/>
    <rect x="0" y="14" width="1044" height="14" fill="#1f2632"/>
    <circle cx="16" cy="14" r="6" fill="#ff5f57"/>
    <circle cx="36" cy="14" r="6" fill="#febc2e"/>
    <circle cx="56" cy="14" r="6" fill="#28c840"/>
    <text x="522" y="18" text-anchor="middle" font-size="10" fill="#6b7280">addiplay · sign in</text>

    <!-- terminal body -->
    <rect x="0" y="28" width="1044" height="564" fill="#151b25"/>

    <!-- ============================================================ -->
    <!-- DIMMED BACKGROUND: ghost of channel list (low opacity)       -->
    <!-- Simulates the blurred pane beneath the popover               -->
    <!-- ============================================================ -->
    <g transform="translate(12,40)" font-size="14" fill="#e6e6e6" xml:space="preserve" opacity="0.15">
      <!-- header -->
      <text x="4" y="0" fill="#e6e6e6" font-weight="700">addiplay</text>
      <rect x="72" y="-13" width="42" height="18" fill="#288cfb"/>
      <text x="76" y="0" fill="#151b25" font-weight="700">DI.fm</text>
      <text x="130" y="0" fill="#e6e6e6">ALL   FAVORITES</text>

      <!-- channel rows (blurred appearance) -->
      <g transform="translate(0,24)">
        <text x="14" y="20">  Classic Trance</text>
        <text x="14" y="40">  Vocal Trance</text>
        <text x="14" y="60">  Progressive</text>
        <text x="14" y="80">  Trance</text>
        <text x="14" y="100">  Psybient</text>
        <text x="14" y="120">  Hard Dance</text>
        <text x="14" y="140">  DJ Mixes</text>
        <text x="14" y="160">  Vocal Lounge</text>
        <text x="14" y="180">  Future Garage</text>
        <text x="14" y="200">  Liquid DnB</text>
      </g>

      <!-- status bar -->
      <rect x="0" y="432" width="1020" height="20" fill="#212737"/>
    </g>

    <!-- ============================================================ -->
    <!-- POPOVER: centered login form                                 -->
    <!-- ============================================================ -->
    <g transform="translate(260,86)" font-size="14" xml:space="preserve">

      <!-- popover drop shadow -->
      <rect x="3" y="4" width="480" height="380" rx="6" fill="#000" opacity="0.35"/>

      <!-- popover panel -->
      <rect x="0" y="0" width="480" height="380" rx="6" fill="#151b25" stroke="#288cfb" stroke-width="1.5"/>

      <!-- CONTENT (matches viewLogin rows) -->

      <!-- 1. Bold header -->
      <text x="24" y="32" fill="#e6e6e6" font-weight="700" font-size="15">Sign in to AudioAddict</text>

      <!-- 2. Separator -->
      <text x="24" y="50" fill="#888">────────────────────────────────────────────────────────</text>

      <!-- 4. Intro copy -->
      <text x="24" y="78" fill="#888">DI.fm / RadioTunes / RockRadio / JazzRadio ...</text>
      <text x="24" y="96" fill="#888">Premium subscription unlocks 256k streams.</text>

      <!-- 7. Email label -->
      <text x="24" y="130" fill="#888">Email</text>
      <!-- 8. Email input (focused — accent border) -->
      <rect x="24" y="138" width="430" height="24" fill="#212737" stroke="#288cfb" stroke-width="1"/>
      <text x="32" y="155" fill="#888" font-size="13">you@example.com</text>
      <!-- blinking cursor -->
      <rect x="162" y="141" width="2" height="18" fill="#e6e6e6">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>

      <!-- 10. Password label -->
      <text x="24" y="190" fill="#888">Password</text>
      <!-- 11. Password input (unfocused — muted border) -->
      <rect x="24" y="198" width="430" height="24" fill="#212737" stroke="#3a4253" stroke-width="1"/>
      <text x="32" y="215" fill="#e6e6e6">●●●●●●●●</text>

      <!-- 13. Submit button (accent-colored = focused state, field index 2) -->
      <rect x="24" y="244" width="118" height="26" rx="3" fill="#288cfb"/>
      <text x="83" y="262" fill="#151b25" font-weight="700" text-anchor="middle">[ Sign in ]</text>

      <!-- 15. Key hints -->
      <text x="24" y="310" fill="#888" font-size="12">tab next field   enter advance/submit   esc cancel   ctrl-c quit</text>

      <!-- Optional error state (shown when loginError is set) -->
      <rect x="24" y="330" width="370" height="22" rx="3" fill="#6b2020" opacity="0.0"/>
      <!-- <text x="32" y="346" fill="#ff6b6b" font-size="12">invalid email or password</text> -->
    </g>
  </g>

  <text x="28" y="700" font-size="10" fill="#9aa3b2">Login overlay: renderCenteredPopover in screen_login.go. Focus state: FocusLogin. Tab cycles email -> password -> submit. Background pane is blurred (paneBlurred).</text>
</svg>
